# UGen classes excluded by design: no counterpart in a self-contained Faust program.
# The translator refuses them with the reason given here instead of "unmapped".
# PV_* classes (phase vocoder) are excluded by prefix, with the FFT reason.

[reasons]
ui = "user interface input (mouse, keyboard): use a control (a SynthDef argument) instead"
server = "talks to the language or the server, which a Faust program does not have"
buffer = "reads or writes a server buffer; buffers are excluded by design"
bus = "reads or writes a server bus other than the audio input and output"
fft = "FFT and phase vocoder chains are excluded by design"
demand = "demand-rate UGens are excluded by design"
platform = "reads hardware a Faust program does not have (Bela analog/digital pins)"

