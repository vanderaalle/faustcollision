derive = "gverb"
faust = { ar = "sc.gverb({in}, {revtime}, {damping}, {inputbw}, {drylevel}, {earlyreflevel}, {taillevel}, {fdnsize}, {lc0}, {lc1}, {lc2}, {lc3}, {ls0}, {ls1}, {ls2}, {ls3}, {tc0}, {tc1}, {tc2}, {tc3}, {ts0}, {ts1}, {ts2}, {ts3}, {dl0}, {dl1}, {dl2}, {dl3}, {dr1}, {dr2}, {dr3})" }
