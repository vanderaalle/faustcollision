# BEQSuite (FilterUGens.cpp:4166): constant inputs -> exact double coefficients
# (derive.py) on the pair biquad sc.sos_g; otherwise next_kk (sc.beq_k: inputs read at the
# block start, ramp in 21 steps). All coefficient inputs at audio rate: next_aa (sc.beq_a,
# per-class read pattern, sc-findings 24).

[BLowPass]
tier = "direct"
inputs = ["in", "freq", "rq"]
template_by = "beq_calc"
derive_when_constant = ["freq", "rq"]
derive = "blowpass"
faust = { ar_i = "sc.sos_g({in}, ({a0h}, {a0l}, {a1h}, {a1l}, {a2h}, {a2l}, {b1h}, {b1l}, {b2h}, {b2l}), 1)" }
faust_var = { ar_k = "sc.beq_k(sc.blpc, {in}, {freq}, {rq}, 0.0)", ar_a = "sc.beq_a(sc.blpc, 0, 0, {in}, {freq}, {rq}, 0.0)" }
compare = "waveform"
# measured: constants 4e-10 or less (exact up to pair rounding); next_aa 2.5e-6 or less; next_kk 5.0e-6 (50 Hz): w, sin,
# s2(w) in float. tol twice the worst case
tol = 1e-5
case = "case_BLowPass"

