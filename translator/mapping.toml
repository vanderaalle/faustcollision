[LinExp]
tier = "direct"
inputs = ["in", "srclo", "srchi", "dstlo", "dsthi"]
# the calc function depends on all bound rates (derive.linexp_calc); sc_reciprocal (rcp +
# Newton) for control and audio-rate bounds: sc.recip's floor (as UnaryOp reciprocal).
# Measured: 5.4e-8 with constant bounds (nova pow, sc.npow), ~3e-7 with recip.
template_by = "linexp_calc"
faust = { ar_i = "sc.linexp_i({in}, {srclo}, {srchi}, {dstlo}, {dsthi}, sc.npow)", ar_k = "sc.linexp_kn({in}, {srclo}, {srchi}, {dstlo}, {dsthi})", ar_a = "sc.linexp_a({in}, {srclo}, {srchi}, {dstlo}, {dsthi})", kr_i = "sc.linexp_i({in}, {srclo}, {srchi}, {dstlo}, {dsthi}, pow)", kr_k = "sc.linexp_kk({in}, {srclo}, {srchi}, {dstlo}, {dsthi})" }
compare = "waveform"
tol = 1e-5
case = "case_LinExp"

