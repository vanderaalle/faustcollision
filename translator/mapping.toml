derive = "pitchshift"
faust = { ar = "sc.pitchshift({fs}, {N}, {slope}, {pitchRatio}, {in})" }
compare = "waveform"
tol = 1e-6
case = "case_PitchShift"

# LocalIn/LocalOut: one feedback bus per rate, one block of delay (codegen.py builds the
# recursion; LocalOuts of a rate are summed in graph order)
[LocalIn]
tier = "direct"
kind = "localin"
compare = "waveform"
tol = 1e-6
case = "case_LocalIn"

[LocalOut]
tier = "direct"
kind = "localout"
compare = "waveform"
tol = 1e-6
case = "case_LocalIn"

[FSinOsc]
tier = "direct"
inputs = ["freq", "iphase"]
# scsynth recomputes b1 = 2 cos(w) in double when freq changes: only a constant freq is ported.
# Measured: ar <= 3e-9 (double state on float pairs, ~48 bits); kr 1.8e-7 is K2A's ramp in the case.
constant_inputs = ["freq", "iphase"]
derive = "fsinosc"
faust = { ar = "sc.fsinosc({bh_ar}, {bl_ar}, {y1h_ar}, {y1l_ar}, {y2h_ar}, {y2l_ar})", kr = "sc.fsinosc_kr({bh_kr}, {bl_kr}, {y1h_kr}, {y1l_kr}, {y2h_kr}, {y2l_kr})" }
self_hold = true
compare = "waveform"
tol = 1e-6
case = "case_FSinOsc"

[SinOscFB]
tier = "direct"
inputs = ["freq", "feedback"]
# both inputs are read once per block (ZIN0). The feedback ramp starts from the feedback
# input's constructor value in scsynth, from its first-block value here: they differ when
# the input comes from a UGen with a constructor sample (an LF oscillator), and at high
# feedback the difference can persist for seconds (measured with LFSaw.kr: ~2 s). Exact
# for constant, control, Line and audio-rate inputs.
faust = { ar = "sc.sinoscfb({freq}, {feedback})", kr = "sc.sinoscfb_kr({freq}, {feedback})" }
self_hold = true
compare = "waveform"
tol = 1e-6
case = "case_SinOscFB"

[VarSaw]
tier = "direct"
inputs = ["freq", "iphase", "width"]
# double phase on float pairs; width read once per block, applied at each wrap.
# kr inputs are already constant across the block, so next_a covers next_k.
constant_inputs = ["iphase"]
faust = { ar = "sc.varsaw_a({freq}, {iphase}, {width})", kr = "sc.varsaw_kr({freq}, {iphase}, {width})" }
self_hold = true
compare = "waveform"
tol = 1e-6
case = "case_VarSaw"

[SyncSaw]
tier = "direct"
inputs = ["syncFreq", "sawFreq"]
# two double phases on float pairs; the per-sample form covers the four calc functions.
# Measured: exact with constant inputs; 6.3e-7 with the master frequency from Line.kr (the
# phase integrates Line's own 1.6e-7 floor); a slave phase on pairs ~1.3e-7.
faust = { ar = "sc.syncsaw_aa({syncFreq}, {sawFreq})", kr = "sc.syncsaw_kr({syncFreq}, {sawFreq})" }
self_hold = true
compare = "waveform"
tol = 1e-6
case = "case_SyncSaw"

[Blip]
tier = "direct"
inputs = ["freq", "numharm"]
# Saw's kernel without the integrator (sc.blit_*); freq and numharm read per block
faust = { ar = "sc.blip({freq}, {numharm})" }
compare = "waveform"
tol = 1e-6
case = "case_Blip"

[Formant]
tier = "direct"
inputs = ["fundfreq", "formfreq", "bwfreq"]
# int32 phases; the restart product overflows like scsynth's (sc-findings 20); per block.
# Measured: bit-exact.
faust = { ar = "sc.formant({fundfreq}, {formfreq}, {bwfreq})" }
compare = "waveform"
tol = 1e-6
case = "case_Formant"

[Klang]
tier = "direct"
inputs = ["freqscale", "freqoffset"]
# read once in the constructor: the states and coefficients come from translator/derive.py
# (sinf/cosf of float arguments). Measured: bit-exact.
variadic = { group = ["freq", "amp", "phase"], constant = true }
constant_inputs = ["freqscale", "freqoffset"]
derive = "klang"
faust = { ar = "sc.klang({n}, ({y1s}), ({y2s}), ({b1s}))" }
compare = "waveform"
tol = 1e-6
case = "case_Klang"

[LFGauss]
tier = "direct"
inputs = ["duration", "width", "iphase", "loop", "doneAction"]
require = { doneAction = 0.0 }
# double phase on float pairs; exp of a double argument within an ulp (expf(hi) (1 + lo)),
# measured 2e-8 (ar). Output below 1e-30 flushed to 0 (scsynth's tail goes denormal).
faust = { ar = "sc.lfgauss_k({duration}, {width}, {iphase}, {loop})", "ar<duration:ar" = "sc.lfgauss_a({duration}, {width}, {iphase}, {loop})", kr = "sc.lfgauss_kr({duration}, {width}, {iphase}, {loop})" }
self_hold = true
compare = "waveform"
tol = 1e-6
case = "case_LFGauss"

[Phasor]
tier = "direct"
inputs = ["trig", "rate", "start", "end", "resetPos"]
# double level on float pairs; next_kk (kr trig) wraps before output, next_ak/_aa after.
# Measured: bit-exact except a rare 1-ulp flip near 0 after a wrap (pair precision:
# 1 sample in 1570 resets on bass_di).
faust = { ar = "sc.phasor_kk({trig}, {rate}, {start}, {end}, {resetPos})", "ar<trig:ar" = "sc.phasor_a({trig}, {rate}, {start}, {end}, {resetPos}, 1)", kr = "sc.phasor_a({trig}, {rate}, {start}, {end}, {resetPos}, sc.krclk)" }
self_hold = true
compare = "waveform"
tol = 1e-6
case = "case_Phasor"

[Vibrato]
tier = "direct"
inputs = ["freq", "rate", "depth", "delay", "onset", "rateVariation", "depthVariation", "iphase", "trig"]
# the variations draw scsynth's random numbers: not ported. freq is read per sample at ar;
# a constant or kr input makes scsynth read past it (sc-findings 21): rejected
require = { rateVariation = 0.0, depthVariation = 0.0 }
ar_inputs = ["freq"]
faust = { ar = "sc.vibrato({freq}, {rate}, {depth}, {delay}, {onset}, {iphase}, {trig})", kr = "sc.vibrato_kr({freq}, {rate}, {depth}, {delay}, {onset}, {iphase}, {trig})" }
self_hold = true
compare = "waveform"
tol = 1e-6
case = "case_Vibrato"

# Wrap, Fold, Clip (LFUGens.cpp): in is read per sample at ar, so it must be audio rate
# there (sc-findings 21); kr lo/hi are ramped per block as each calc function does.
