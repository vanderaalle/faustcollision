# Filters (FilterUGens.cpp): double state and coefficients in scsynth, float here.
# Mapped at audio rate; .kr is not ported yet (translation error).

[LPF]
tier = "direct"
inputs = ["in", "freq"]
# Butterworth biquad; freq read per block, coefficients moved in 21 steps of 3 samples.
# Float state at 30 Hz: 1.5e-4 measured (a float64 run of the same recursion is exact).
faust = { ar = "sc.lpf({in}, {freq})", kr = "sc.lpf_kr({in}, {freq})" }
compare = "waveform"
# kr: one sample per block at SR / 64, new coefficients at once (_next_1); measured 9.8e-06
tol = 5e-4
case = "case_LPF"

[HPF]
tier = "direct"
inputs = ["in", "freq"]
