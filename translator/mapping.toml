[UnaryOpUGen.operators.51]
name = "triWindow"
faust = "sc.triwindow({a})"
compare = "waveform"
tol = 1e-06
case = "case_UnaryOp_triWindow"

[UnaryOpUGen.operators.52]
name = "ramp"
faust = "sc.ramp({a})"
compare = "waveform"
tol = 1e-06
case = "case_UnaryOp_ramp"

[UnaryOpUGen.operators.53]
name = "scurve"
faust = "sc.scurve({a})"
compare = "waveform"
tol = 1e-06
case = "case_UnaryOp_scurve"

[MulAdd]
tier = "direct"
inputs = ["in", "mul", "add"]
faust = "({in} * {mul} + {add})"
compare = "waveform"
tol = 1e-6
case = "case_MulAdd"

[Saw]
tier = "direct"
inputs = ["freq"]
# Port of OscUGens.cpp Saw: band-limited impulse train from the sine/cosecant tables
# plus a 0.999 leaky integrator (hence falling, at half the level of an ideal saw).
# freq is read per block; kernel crossfade when the harmonic count changes.
faust = { ar = "sc.saw({freq})" }
compare = "waveform"
tol = 1e-3
case = "case_Saw"

[MoogFF]
tier = "approximate"
inputs = ["in", "freq", "gain", "reset"]
require = { reset = 0.0 }
# Line-by-line port of MoogFF.cpp (Fontana 2007 structure). A float64 run of the same
# algorithm matches scsynth to < 1e-3. Single precision (the Daisy target) reaches ~1e-2 at
# gain 4, the self-oscillation edge; tol is that floor ×2. Gain ≤ 2 stays under 1e-3.
faust = { ar = "sc.moogff({freq}, {gain}, {in})" }
compare = "waveform"
tol = 2e-2
case = "case_MoogFF"

[Amplitude]
tier = "approximate"
inputs = ["in", "attackTime", "releaseTime"]
# -20 dB time constants (measured). SC's .kr loops over the audio block with control-rate
# coefficients, so its times are 1/blocksize of the stated ones; the port reproduces that.
# .ar is sample-exact. .kr runs one block late (sc.krhold): with the default 10 ms times the
# value is |in| at a block edge, so at bass frequencies 10 ms envelopes differ by ~2 dB.
# With a kr input it is a true control-rate follower: one update per block (Amplitude_next).
faust = { ar = "sc.amplitude({attackTime}, {releaseTime}, {in})", kr = "sc.amplitude_kr({attackTime}, {releaseTime}, {in})", "kr<kr" = "sc.amplitude_krkr({attackTime}, {releaseTime}, {in})" }
compare = "envelope"
tol = 2.5
case = "case_Amplitude"

[Pitch]
tier = "handwritten"
inputs = ["in", "initFreq", "minFreq", "maxFreq", "execFreq", "maxBinsPerOctave", "median",
          "ampThreshold", "peakThreshold", "downSample", "clar"]
require = { execFreq = 100.0, maxBinsPerOctave = 16.0, median = 1.0, peakThreshold = 0.5, downSample = 1.0, clar = 0.0 }
outputs = 2
# Not a port: SC's Pitch is autocorrelation-based, this is Faust's zero-crossing tracker
# (an.pitchTracker) with SC's clamping, voicing threshold and hold. Hardware fallback: YIN in the shell.
faust = { kr = "sc.pitch({initFreq}, {minFreq}, {maxFreq}, {ampThreshold}, {in})" }
compare = "statistics"
tol = 6.0
case = "case_Pitch"

[DC]
tier = "direct"
inputs = ["in"]
# DC_Ctor reads its input once; a signal there would be frozen at its first sample.
constant_inputs = ["in"]
faust = { ar = "{in}", kr = "{in}" }
compare = "waveform"
tol = 1e-6
case = "case_DC"

[K2A]
tier = "direct"
inputs = ["in"]
# LFUGens.cpp: ramps linearly to the new kr value across the block, i.e. sc.kr2ar.
kr_interpolate = true
kr_inputs = ["in"]
faust = { ar = "{in}" }
compare = "waveform"
tol = 1e-6
case = "case_K2A"

[A2K]
tier = "direct"
inputs = ["in"]
# LFUGens.cpp: the first sample of each block. Causal, so exact (sc.a2k).
self_hold = true
faust = { kr = "sc.a2k({in})" }
compare = "waveform"
tol = 1e-6
case = "case_A2K"

[SinOsc]
tier = "direct"
inputs = ["freq", "phase"]
# 8192-point interpolated wavetable, 32-bit phase (OscUGens.cpp). The increment is
# (int32)(double * freq) for kr/constant freq, a float product for audio-rate freq.
kr_interpolate = ["phase"]
faust = { ar = "sc.sinosc_d({freq}, {phase})", "ar<ar" = "sc.sinosc_f({freq}, {phase})", kr = "sc.sinosc_kr({freq}, {phase})" }
compare = "waveform"
# table built from float sin() here, double sin() cast to float in scsynth
tol = 1e-6
case = "case_SinOsc"

[LFSaw]
tier = "direct"
inputs = ["freq", "iphase"]
# double phase (LFUGens.cpp), emulated as a float pair; the constructor's step is kept.
constant_inputs = ["iphase"]
faust = { ar = "sc.lfsaw({freq}, {iphase})", "ar<ar" = "sc.lfsaw_ar({freq}, {iphase})", kr = "sc.lfsaw_kr({freq}, {iphase})" }
compare = "waveform"
tol = 1e-6
case = "case_LFSaw"

[LFTri]
tier = "direct"
