# Lines (LFUGens.cpp). start/end/dur read once; doneAction is server machinery.

[Line]
tier = "direct"
inputs = ["start", "end", "dur", "doneAction"]
require = { doneAction = 0.0 }
self_hold = true
# Constant start/end/dur: exact (double level on float pairs, nova's SSE lanes at ar)
# except rare 1-ulp flips where the pair's ~48 bits round differently from the double.
# Otherwise (controls, read once): closed form in float, measured 1.6e-7.
derive_when_constant = ["start", "end", "dur"]
derive = "line"
faust = { ar = "sc.line_x({n_ar}, {lh_ar}, {ll_ar}, {sh_ar}, {sl_ar}, {bh_ar}, {bl_ar}, {endf})", kr = "sc.line_x_kr({n_kr}, {lh_kr}, {ll_kr}, {sh_kr}, {sl_kr}, {endf})" }
faust_var = { ar = "sc.line({start}, {end}, {dur})", kr = "sc.line_kr({start}, {end}, {dur})" }
compare = "waveform"
tol = 1e-5
case = "case_Line"

[XLine]
tier = "direct"
inputs = ["start", "end", "dur", "doneAction"]
require = { doneAction = 0.0 }
self_hold = true
faust = { ar = "sc.xline({start}, {end}, {dur})", kr = "sc.xline_kr({start}, {end}, {dur})" }
compare = "waveform"
tol = 1e-5
case = "case_XLine"

[EnvGen]
tier = "direct"
# gate, scales, then the Env array: initLevel, numStages, releaseNode, loopNode,
# and per stage (level, time, shape, curve), passed as parallel lists
inputs = ["gate", "levelScale", "levelBias", "timeScale", "doneAction", "initLevel", "numStages", "releaseNode", "loopNode"]
variadic = { group = ["level", "time", "shape", "curve"] }
require = { doneAction = 0.0 }
constant_inputs = ["numStages", "releaseNode", "loopNode"]
# the template samples per block itself (gate checks at block start, kr steps)
self_hold = true
faust = { ar = "sc.envgen_ak({n}, {gate}, {levelScale}, {levelBias}, {timeScale}, {initLevel}, {releaseNode}, {loopNode}, ({levels}), ({times}), ({shapes}), ({curves}))", "ar<gate:ar" = "sc.envgen_aa({n}, {gate}, {levelScale}, {levelBias}, {timeScale}, {initLevel}, {releaseNode}, {loopNode}, ({levels}), ({times}), ({shapes}), ({curves}))", kr = "sc.envgen_kr({n}, {gate}, {levelScale}, {levelBias}, {timeScale}, {initLevel}, {releaseNode}, {loopNode}, ({levels}), ({times}), ({shapes}), ({curves}))" }
compare = "waveform"
tol = 1e-5
case = "case_EnvGen"

