faust = { ar = "sc.pan2({in}, {pos}, {level})", "ar<pos:ar" = "sc.pan2_ar({in}, {pos}, {level})", kr = "sc.pan2_kr({in}, {pos}, {level})" }
compare = "waveform"
tol = 1e-6
