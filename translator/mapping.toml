compare = "waveform"
tol = 1e-5
case = "case_XLine"

[EnvGen]
tier = "direct"
# gate, scales, then the Env array: initLevel, numStages, releaseNode, loopNode,
# and per stage (level, time, shape, curve), passed as parallel lists
inputs = ["gate", "levelScale", "levelBias", "timeScale", "doneAction", "initLevel", "numStages", "releaseNode", "loopNode"]
variadic = { group = ["level", "time", "shape", "curve"] }
require = { doneAction = 0.0 }
constant_inputs = ["numStages", "releaseNode", "loopNode"]
# the template samples per block itself (gate checks at block start, kr steps)
self_hold = true
faust = { ar = "sc.envgen_ak({n}, {gate}, {levelScale}, {levelBias}, {timeScale}, {initLevel}, {releaseNode}, {loopNode}, ({levels}), ({times}), ({shapes}), ({curves}))", "ar<gate:ar" = "sc.envgen_aa({n}, {gate}, {levelScale}, {levelBias}, {timeScale}, {initLevel}, {releaseNode}, {loopNode}, ({levels}), ({times}), ({shapes}), ({curves}))", kr = "sc.envgen_kr({n}, {gate}, {levelScale}, {levelBias}, {timeScale}, {initLevel}, {releaseNode}, {loopNode}, ({levels}), ({times}), ({shapes}), ({curves}))" }
compare = "waveform"
tol = 1e-5
case = "case_EnvGen"

# Dynamics (FilterUGens.cpp)

[Limiter]
tier = "direct"
inputs = ["in", "level", "dur"]
# lookahead by a 2 * dur delay: causal, so exact; dur sizes the buffer
constant_inputs = ["dur"]
faust = { ar = "sc.limiter({in}, {level}, {dur})" }
compare = "waveform"
tol = 1e-5
case = "case_Limiter"

[Normalizer]
tier = "direct"
inputs = ["in", "level", "dur"]
constant_inputs = ["dur"]
faust = { ar = "sc.normalizer({in}, {level}, {dur})" }
compare = "waveform"
tol = 1e-5
case = "case_Normalizer"

[Compander]
tier = "approximate"
inputs = ["in", "control", "thresh", "slopeBelow", "slopeAbove", "clampTime", "relaxTime"]
# scsynth's gain for a block depends on the control signal up to the block's end; the
# causal port is one block late (as Amplitude.kr)
faust = { ar = "sc.compander({in}, {control}, {thresh}, {slopeBelow}, {slopeAbove}, {clampTime}, {relaxTime})" }
compare = "envelope"
tol = 1.0
case = "case_Compander"

[FreeVerb]
tier = "direct"
inputs = ["in", "mix", "room", "damp"]
# ReverbUGens.cpp: fixed comb/allpass lengths in samples, as scsynth
faust = { ar = "sc.freeverb({in}, {mix}, {room}, {damp})" }
compare = "waveform"
tol = 1e-5
case = "case_FreeVerb"

[FreeVerb2]
tier = "direct"
inputs = ["in", "in2", "mix", "room", "damp"]
outputs = 2
faust = { ar = "sc.freeverb2({in}, {in2}, {mix}, {room}, {damp})" }
compare = "waveform"
tol = 1e-5
case = "case_FreeVerb2"

[GVerb]
tier = "direct"
inputs = ["in", "roomsize", "revtime", "damping", "inputbw", "spread", "drylevel", "earlyreflevel", "taillevel", "maxroomsize"]
outputs = 2
# roomsize, spread and maxroomsize fix the delay structure (computed by translator/derive.py
# for 48 kHz, as scsynth's constructor does); the other parameters are read per block
constant_inputs = ["roomsize", "spread", "maxroomsize"]
derive = "gverb"
faust = { ar = "sc.gverb({in}, {revtime}, {damping}, {inputbw}, {drylevel}, {earlyreflevel}, {taillevel}, {fdnsize}, {lc0}, {lc1}, {lc2}, {lc3}, {ls0}, {ls1}, {ls2}, {ls3}, {tc0}, {tc1}, {tc2}, {tc3}, {ts0}, {ts1}, {ts2}, {ts3}, {dl0}, {dl1}, {dl2}, {dl3}, {dr1}, {dr2}, {dr3})" }
compare = "waveform"
tol = 1e-4
case = "case_GVerb"

[Klank]
tier = "direct"
inputs = ["input", "freqscale", "freqoffset", "decayscale"]
# scsynth computes the coefficients once, in the constructor (mixing float and double):
# all but the input are constants, and the coefficients come from translator/derive.py
variadic = { group = ["freq", "amp", "ring"], constant = true }
constant_inputs = ["freqscale", "freqoffset", "decayscale"]
derive = "klank"
faust = { ar = "sc.klank({n}, {input}, ({b1s}), ({b2s}), ({a0s}))" }
compare = "waveform"
tol = 1e-5
case = "case_Klank"

[PitchShift]
tier = "direct"
inputs = ["in", "windowSize", "pitchRatio", "pitchDispersion", "timeDispersion"]
constant_inputs = ["windowSize"]
# the dispersions draw scsynth's random numbers: not ported
require = { pitchDispersion = 0.0, timeDispersion = 0.0 }
derive = "pitchshift"
faust = { ar = "sc.pitchshift({fs}, {N}, {slope}, {pitchRatio}, {in})" }
compare = "waveform"
tol = 1e-6
case = "case_PitchShift"
